port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50040
  use_external_ip: false
  # Servidor e clientes de teste rodam na mesma máquina (dev local, Docker
  # Desktop sem host networking) — sem isso, o LiveKit descobre via STUN um
  # endereço externo cuja porta não bate com o range publicado 1:1 no
  # docker-compose, e todo par de candidato ICE falha (visto nos logs:
  # "ICE candidate pair stats" ... "state": "failed" em todos os pares).
  node_ip: 127.0.0.1
room:
  empty_timeout: 30
  departure_timeout: 20
# api_key precisa ser o mesmo nome de chave configurado em LIVEKIT_KEYS
# (docker-compose.yml) — se trocar LIVEKIT_API_KEY no .env, troca aqui também
# (esse arquivo é montado como volume estático, docker-compose não interpola
# ${VAR} dentro dele).
webhook:
  api_key: devkey
  urls:
    - http://host.docker.internal:3000/api/calls/webhook
